[package]
name = "autojoin-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
crypto_box = { version = "0.9", features = ["seal"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snarkvm-console = { version = "=4.9.1", default-features = false, features = ["account", "program"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zeroize = "1"
